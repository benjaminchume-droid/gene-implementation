[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gene-ai"
version = "0.1.0"
description = "GENE AI — modular neural intelligence runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Velocity Labs" }
]

[project.scripts]
gene = "cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent", "agent.*",
    "agents", "agents.*",
    "browser", "browser.*",
    "capabilities", "capabilities.*",
    "cli", "cli.*",
    "config", "config.*",
    "context", "context.*",
    "core", "core.*",
    "datasets", "datasets.*",
    "desktop", "desktop.*",
    "diagnostics", "diagnostics.*",
    "discovery", "discovery.*",
    "evaluation", "evaluation.*",
    "evolution", "evolution.*",
    "experimentation", "experimentation.*",
    "genome", "genome.*",
    "inference", "inference.*",
    "knowledge", "knowledge.*",
    "learning", "learning.*",
    "levels", "levels.*",
    "memory", "memory.*",
    "mcp_runtime", "mcp_runtime.*",
    "model", "model.*",
    "models", "models.*",
    "multimodal", "multimodal.*",
    "planning", "planning.*",
    "runtime", "runtime.*",
    "scheduler", "scheduler.*",
    "skills", "skills.*",
    "soul", "soul.*",
    "specializations", "specializations.*",
    "tools", "tools.*",
    "training", "training.*",
    "vision", "vision.*",
    "voice", "voice.*",
    "workers", "workers.*"
]
exclude = ["tests", "tests.*", "gene1", "gene1.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
